[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgen-creator"
version = "0.1.0"
description = "Source-grounded deliverable automation: live UI-to-source bridge, line-level execution tracing, wikidocs-style doc generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jinsoo96" }]

[project.optional-dependencies]
bridge = ["playwright>=1.40"]

[project.scripts]
creator = "xgen_creator.cli:main"

[tool.setuptools.packages.find]
include = ["xgen_creator*"]
